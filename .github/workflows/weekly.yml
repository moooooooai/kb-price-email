name: KB 주간 시세 리포트

on:
  schedule:
    - cron: '0 4 * * 5'   # 매주 금 04:00 UTC = 13:00 KST
  workflow_dispatch:
    inputs:
      dry:
        description: '미리보기만(발송 안 함, email.html 아티팩트 업로드)'
        type: boolean
        default: false

permissions:
  contents: write   # keepalive 빈 커밋 push용
  pages: write      # GitHub Pages 배포용
  id-token: write   # Pages 배포 OIDC

jobs:
  send:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm ci
      - name: Install Korean fonts (Chromium 렌더용)
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - name: Send report
        run: npm run ${{ inputs.dry && 'preview' || 'send' }}
        env:
          NAVER_USER: ${{ secrets.NAVER_USER }}
          NAVER_PASS: ${{ secrets.NAVER_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
      - name: Upload preview (dry only)
        if: ${{ inputs.dry }}
        uses: actions/upload-artifact@v4
        with:
          name: email-preview
          path: email.html
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact (public/index.html)
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Keepalive (60일 무커밋 자동 비활성화 방지)
        if: always()   # 발송 실패해도 실행
        run: |
          AGE_DAYS=$(( ( $(date +%s) - $(git log -1 --format=%ct) ) / 86400 ))
          echo "마지막 커밋 경과: ${AGE_DAYS}일"
          if [ "$AGE_DAYS" -ge 50 ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keepalive (예약 워크플로 60일 비활성화 방지)"
            git push
            echo "keepalive 커밋 push 완료"
          else
            echo "최근 커밋 있음 → keepalive 불필요"
          fi
